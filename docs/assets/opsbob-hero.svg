<svg width="1200" height="420" viewBox="0 0 1200 420" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">OpsBob autonomous production intelligence</title>
  <desc id="desc">An animated operations pipeline moves from incident detection through AI diagnosis and guarded remediation.</desc>
  <defs>
    <linearGradient id="bg" x1="70" y1="20" x2="1130" y2="400" gradientUnits="userSpaceOnUse">
      <stop stop-color="#050807"/>
      <stop offset="0.52" stop-color="#07110D"/>
      <stop offset="1" stop-color="#050706"/>
    </linearGradient>
    <linearGradient id="brand" x1="390" y1="100" x2="815" y2="100" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F4F4F4"/>
      <stop offset="0.46" stop-color="#F4F4F4"/>
      <stop offset="0.47" stop-color="#00F58B"/>
      <stop offset="1" stop-color="#42BE65"/>
    </linearGradient>
    <linearGradient id="flow" x1="170" y1="317" x2="1030" y2="317" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FA4D56"/>
      <stop offset="0.46" stop-color="#0F62FE"/>
      <stop offset="1" stop-color="#00F58B"/>
    </linearGradient>
    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="panel"><rect x="20" y="20" width="1160" height="380" rx="22"/></clipPath>
    <style>
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
      .sans { font-family: Inter, IBM Plex Sans, Arial, sans-serif; }
      .pulse { animation: pulse 2.4s ease-in-out infinite; transform-origin: center; }
      .blink { animation: blink 1.15s steps(2, end) infinite; }
      .scan { animation: scan 5s linear infinite; }
      .dash { stroke-dasharray: 8 13; animation: dash 2s linear infinite; }
      .step1 { animation: stage 6s ease-in-out infinite; }
      .step2 { animation: stage 6s 1.5s ease-in-out infinite; opacity: .42; }
      .step3 { animation: stage 6s 3s ease-in-out infinite; opacity: .42; }
      .step4 { animation: stage 6s 4.5s ease-in-out infinite; opacity: .42; }
      @keyframes pulse { 0%,100% { opacity:.55; transform:scale(.92) } 50% { opacity:1; transform:scale(1.08) } }
      @keyframes blink { 50% { opacity:.18 } }
      @keyframes scan { 0% { transform:translateY(-35px); opacity:0 } 12% { opacity:.55 } 82% { opacity:.2 } 100% { transform:translateY(430px); opacity:0 } }
      @keyframes dash { to { stroke-dashoffset:-42 } }
      @keyframes stage { 0%,18% { opacity:1 } 30%,100% { opacity:.42 } }
    </style>
  </defs>

  <rect x="20" y="20" width="1160" height="380" rx="22" fill="url(#bg)" stroke="#26302C"/>
  <g clip-path="url(#panel)">
    <path d="M20 105H1180M20 220H1180M20 350H1180" stroke="#0C1B15"/>
    <path d="M175 20V400M600 20V400M1025 20V400" stroke="#0A1712"/>
    <rect class="scan" x="20" y="-35" width="1160" height="34" fill="url(#flow)" opacity=".12"/>
  </g>

  <g class="mono" font-size="12" letter-spacing="2.2">
    <circle class="pulse" cx="75" cy="65" r="5" fill="#00F58B" filter="url(#softGlow)"/>
    <text x="91" y="70" fill="#8DFFBD">SYSTEM ONLINE</text>
    <text x="1124" y="70" text-anchor="end" fill="#6F7C76">IBM BOB HACKATHON 2026</text>
  </g>

  <text x="600" y="160" text-anchor="middle" fill="url(#brand)" class="sans" font-size="82" font-weight="800" letter-spacing="18">OPSBOB</text>
  <text x="600" y="200" text-anchor="middle" fill="#A6B0AB" class="mono" font-size="14" letter-spacing="5">AUTONOMOUS PRODUCTION INTELLIGENCE</text>
  <text x="600" y="235" text-anchor="middle" fill="#617069" class="mono" font-size="12" letter-spacing="2">OBSERVE  /  REASON  /  VERIFY  /  REMEDIATE</text>

  <path class="dash" d="M170 317H1030" stroke="url(#flow)" stroke-width="2"/>

  <g class="step1">
    <circle cx="170" cy="317" r="28" fill="#190A0C" stroke="#FA4D56"/>
    <circle cx="170" cy="317" r="7" fill="#FA4D56" filter="url(#glow)"/>
    <text x="170" y="370" text-anchor="middle" fill="#FA8D93" class="mono" font-size="12" letter-spacing="1.5">DETECT</text>
  </g>
  <g class="step2">
    <circle cx="455" cy="317" r="28" fill="#071225" stroke="#4589FF"/>
    <path d="M445 317H465M455 307V327" stroke="#78A9FF" stroke-width="3" stroke-linecap="round"/>
    <text x="455" y="370" text-anchor="middle" fill="#78A9FF" class="mono" font-size="12" letter-spacing="1.5">DIAGNOSE</text>
  </g>
  <g class="step3">
    <circle cx="745" cy="317" r="28" fill="#101025" stroke="#A56EFF"/>
    <path d="M733 317L741 325L758 308" stroke="#BE95FF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="745" y="370" text-anchor="middle" fill="#BE95FF" class="mono" font-size="12" letter-spacing="1.5">VERIFY</text>
  </g>
  <g class="step4">
    <circle cx="1030" cy="317" r="28" fill="#06180F" stroke="#00F58B"/>
    <path d="M1019 317L1027 325L1042 309" stroke="#00F58B" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="1030" y="370" text-anchor="middle" fill="#8DFFBD" class="mono" font-size="12" letter-spacing="1.5">REMEDIATE</text>
  </g>

  <rect class="blink" x="881" y="224" width="8" height="14" fill="#00F58B"/>
</svg>
