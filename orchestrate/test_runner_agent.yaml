name: test_runner_agent
description: Executes regression tests on fixed code to verify correctness
instructions: |
  You execute the test suite for the affected service. Run npm test and report
  the pass/fail counts. If any test fails, the deployment should be blocked.
model: ibm/granite-3-8b-instruct
tools:
  - name: run_regression_tests
    type: api
    endpoint: http://localhost:8000/orchestrate/run-tests
    method: POST
    input_schema:
      type: object
      properties:
        incident_id:
          type: string
        test_command:
          type: string
          default: "npm test"
        working_dir:
          type: string
      required: [incident_id]
    output_schema:
      type: object
      properties:
        passed:
          type: integer
        failed:
          type: integer
        verdict:
          type: string
          enum: [PASS, WARN, FAIL]
        output:
          type: string
